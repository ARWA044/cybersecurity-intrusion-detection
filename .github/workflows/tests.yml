name: IDS tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "scikit-learn>=1.5" pandas numpy imbalanced-learn xgboost pytest
      - run: python -m pytest -q tests
